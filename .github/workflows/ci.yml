name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build (alle Targets, inkl. SwiftUI-App)
        run: swift build -c release

      - name: Test (Finanzmathematik + Persistenz)
        # --parallel ist nötig, damit SwiftPM die xUnit-XML für XCTest schreibt.
        run: swift test --parallel --xunit-output test-results.xml

      - name: Test-Report veröffentlichen
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Swift-Tests
          path: test-results.xml
          reporter: swift-xunit
